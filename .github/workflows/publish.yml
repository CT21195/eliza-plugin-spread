# Publishes eliza-plugin-spread to npm on every GitHub Release.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher ->
# GitHub Actions: owner CT21195, repository eliza-plugin-spread,
# workflow file publish.yml, no environment.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm run build
      - run: npm publish --access public
